<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stagebook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Stagebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one-screen app shell. Slim top bar, then a single working surface (list, chart, or stage view). */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --surface-2: #e3e6eb;
  --fg: #15171c;
  --muted: #5b6270;
  --line: #d3d7de;
  --accent: #c2410c;
  --accent-fg: #ffffff;
  --chord: #b43c0b;
  --ok: #15803d;
  --warn: #a16207;
  --bad: #b91c1c;
  --sticky-bg: #fde68a;
  --sticky-fg: #3a2e00;
  --shadow: 0 1px 2px rgb(15 17 21 / 0.08), 0 6px 18px rgb(15 17 21 / 0.08);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --surface-2: #232730; --fg: #eceef2; --muted: #9aa1ad;
    --line: #2d323c; --accent: #fb8a3c; --accent-fg: #1b0d02; --chord: #ffa25a;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --sticky-bg: #4b3d0d; --sticky-fg: #fff4c7;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --surface-2: #232730; --fg: #eceef2; --muted: #9aa1ad;
  --line: #2d323c; --accent: #fb8a3c; --accent-fg: #1b0d02; --chord: #ffa25a;
  --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --sticky-bg: #4b3d0d; --sticky-fg: #fff4c7;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; overflow: hidden; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; margin-right: 4px; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; font-weight: 700; color: var(--muted); cursor: pointer; }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--fg); }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--bg); cursor: pointer; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.status.ok i { background: var(--ok); }
.status.warn i { background: var(--warn); }
.status.bad i { background: var(--bad); }

.main { flex: 1; min-height: 0; overflow: auto; padding-block: 20px 40px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.main.fill { overflow: hidden; display: flex; flex-direction: column; padding-block: 0; padding-left: 0; padding-right: 0; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

h1, h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.01em; line-height: 1.02; margin: 0; text-wrap: balance; }
h1 { font-size: 40px; }
h2 { font-size: 26px; }
.pagehead { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--fg); white-space: nowrap; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: 14px; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:disabled { opacity: 0.45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg .btn { border: 0; border-radius: 0; min-height: 38px; }
.seg .btn + .btn { border-left: 1px solid var(--line); }
.seg .val { display: inline-flex; align-items: center; padding: 0 10px; font-weight: 700; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 52px; justify-content: center; font-size: 14px; }

input[type="text"], input[type="search"], input[type="url"], input[type="number"], input[type="date"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; min-height: 42px; width: 100%; }
textarea { resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
label.field > input, label.field > select, label.field > textarea { color: var(--fg); font-weight: 400; font-size: 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.grid input, .grid select { min-width: 0; max-width: 100%; }
input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; }
.setfields { grid-template-columns: minmax(0, 2fr) minmax(0, 150px) minmax(0, 1.5fr); }
@media (max-width: 600px) { .setfields { grid-template-columns: minmax(0, 1fr) minmax(0, 150px); } .setfields > label:first-child { grid-column: 1 / -1; } }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; font-weight: 700; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tag { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 7px; }
.keybadge { font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--chord); border: 1.5px solid currentColor; border-radius: 6px; padding: 0 6px; line-height: 1.5; white-space: nowrap; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.list > li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; background: transparent; border: 0; cursor: pointer; min-height: 60px; }
.row:hover { background: var(--surface-2); }
.row .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .title { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty strong { color: var(--fg); font-size: 18px; }

/* Song view */
.songhead { display: flex; flex-direction: column; gap: 10px; padding-block: 12px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); background: var(--surface); border-bottom: 1px solid var(--line); }
.songhead .titleline { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.songhead h1 { font-size: 34px; }
.songhead .artist { color: var(--muted); font-size: 17px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .sp { flex: 1; }
.warnbar { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: var(--radius); border: 1.5px solid var(--bad); background: var(--bg); }
.notebar { background: var(--sticky-bg); color: var(--sticky-fg); padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); font-size: 15px; white-space: pre-wrap; border-bottom: 1px solid var(--line); }
.sheetwrap { flex: 1; min-height: 0; position: relative; background: var(--bg); }
.sheet-scroll { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet { position: relative; display: inline-block; min-width: 100%; padding: 18px var(--gutter-r) 40vh var(--gutter-l); }
.sheet.drawing { touch-action: none; }
.sheet canvas.ink { position: absolute; left: 0; top: 0; pointer-events: none; }
.chart { font-family: var(--font-mono); line-height: 1.4; font-size: 18px; position: relative; }
.chart .ln { white-space: pre; min-height: 1.4em; }
.chart .ch { color: var(--chord); font-weight: 700; }
.chart .fill { color: var(--muted); }
.chart .sec { font-family: var(--font-body); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78em; color: var(--muted); margin-top: 0.7em; border-bottom: 1px solid var(--line); display: inline-block; min-height: 0; }
.chart .sec + .ln { margin-top: 0.25em; }
.chart .cmt { font-family: var(--font-body); font-style: italic; color: var(--muted); }
.chart .tab { color: var(--fg); opacity: 0.85; }
.chart a { color: var(--accent); }
.pdfpages { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.pdfpages canvas { width: 100%; height: auto; display: block; background: #fff; border-radius: 4px; box-shadow: var(--shadow); }
.sheet.pdfmode { display: block; max-width: 1000px; margin: 0 auto; }
.sticky { position: absolute; width: 15em; max-width: 70vw; background: var(--sticky-bg); color: var(--sticky-fg); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; font-family: var(--font-body); font-size: 15px; z-index: 2; }
.sticky .grip { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 0 10px; cursor: grab; touch-action: none; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; user-select: none; -webkit-user-select: none; }
.sticky .grip button { border: 0; background: transparent; color: inherit; font-size: 18px; padding: 2px 8px; cursor: pointer; }
.sticky textarea { background: transparent; border: 0; color: inherit; min-height: 60px; resize: none; padding: 4px 10px 10px; font-size: 15px; }
.pdfnote { padding: 24px; color: var(--muted); }

.tray { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); z-index: 5; max-width: calc(100% - 24px); }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }

/* Editor */
.editor { display: flex; flex-direction: column; gap: 14px; }
.palette { position: sticky; top: -20px; z-index: 3; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.prow { display: flex; gap: 5px; overflow-x: auto; align-items: center; scrollbar-width: thin; padding-bottom: 2px; }
.prow .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; padding-right: 4px; min-width: 64px; }
.pk { min-width: 44px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-family: var(--font-mono); font-weight: 700; cursor: pointer; padding: 0 9px; white-space: nowrap; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.pk.c { color: var(--chord); }
.pk.s { font-family: var(--font-body); font-size: 14px; }
textarea.chartedit { font-family: var(--font-mono); font-size: 16px; line-height: 1.45; min-height: 50vh; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
.pdfbox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.savedline { font-size: 13px; color: var(--muted); }

.tabsheet { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.45); display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.tabpanel { background: var(--surface); width: min(1000px, 100%); max-height: 100%; overflow: auto; border-radius: 16px 16px 0 0; padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.tabgrid { display: grid; justify-content: start; overflow-x: auto; padding-block: 6px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tabgrid .lab { position: sticky; left: 0; z-index: 1; background: var(--surface); font-family: var(--font-mono); font-weight: 700; padding: 0 8px 0 10px; display: flex; align-items: center; justify-content: flex-end; color: var(--muted); }
.tcell { min-width: 40px; height: 42px; border: 0; padding: 0 3px; cursor: pointer; font-family: var(--font-mono); font-weight: 700; font-size: 17px; color: var(--chord); background: linear-gradient(var(--muted), var(--muted)) center / 100% 1.5px no-repeat; touch-action: manipulation; }
.tcell span { background: var(--surface); padding: 0 3px; border-radius: 4px; }
.tcell.selcol { background-color: var(--surface-2); }
.tcell.selcol span { background: var(--surface-2); }
.tcell.sel { box-shadow: inset 0 0 0 2.5px var(--accent); border-radius: 8px; }
.tcell.bar { min-width: 16px; background: linear-gradient(var(--fg), var(--fg)) center / 2px 100% no-repeat; }
.tpad { display: flex; flex-wrap: wrap; gap: 6px; }
.tabpreview { margin: 0; font-family: var(--font-mono); font-size: 14px; line-height: 1.35; background: var(--bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
/* Sets */
.setitems .row { cursor: default; }
.openbtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: transparent; border: 0; padding: 4px 0; margin: -4px 0; text-align: left; cursor: pointer; border-radius: 8px; }
.openbtn:hover .title { color: var(--accent); }
.num { font-family: var(--font-mono); font-weight: 700; color: var(--muted); width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
.breakrow { background: var(--surface-2); }
.breakrow .title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; }
.picker { display: flex; flex-direction: column; gap: 8px; }
.picker .list { max-height: 320px; overflow: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }

/* Perform */
.perform { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 20; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.perf-top, .perf-bottom { display: flex; align-items: center; gap: 8px; padding-block: 6px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); background: var(--surface); flex-wrap: wrap; }
.perf-top { border-bottom: 1px solid var(--line); }
.perf-bottom { border-top: 1px solid var(--line); }
.perf-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.perf-title strong { font-family: var(--font-display); font-size: 26px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
.perf-count { font-family: var(--font-mono); font-weight: 700; color: var(--muted); font-size: 14px; white-space: nowrap; }
.perf-next { flex: 1; min-width: 0; text-align: center; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.perf-next strong { color: var(--fg); }
.perf-bottom .btn { min-width: 96px; min-height: 48px; font-size: 17px; }
.breakpage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.breakpage div { font-family: var(--font-display); font-weight: 800; font-size: 72px; text-transform: uppercase; letter-spacing: 0.04em; }
.perf-list { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow: auto; z-index: 6; }
.perf-list .row[aria-current="true"] { background: var(--surface-2); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; display: flex; gap: 12px; align-items: center; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 15px; }
.toast button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 7px; padding: 3px 10px; font-weight: 700; cursor: pointer; }
.menu { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; z-index: 30; min-width: 220px; max-height: 60vh; overflow: auto; display: flex; flex-direction: column; }
.menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 7px; cursor: pointer; font-weight: 700; }
.menu button:hover { background: var(--surface-2); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  h1 { font-size: 32px; }
  .songhead h1 { font-size: 26px; }
  .perf-title strong { font-size: 20px; }
  .perf-bottom .btn { min-width: 70px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app"></div>

<script>
"use strict";
/* The same file runs two ways: inside the Claude app (cloud sync through window.claude) and as the
   stand-alone home-screen app, which keeps everything on the iPad and works with no internet. */
const IN_CLAUDE = !!(window.claude && window.claude.use);
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const debounceMap = new Map();
function debounce(key, ms, fn) { clearTimeout(debounceMap.get(key)); debounceMap.set(key, setTimeout(() => { debounceMap.delete(key); fn(); }, ms)); }
function loadPrefs() { try { return JSON.parse(localStorage.getItem("stagebook.prefs") || "{}"); } catch { return {}; } }
function savePrefs() { try { localStorage.setItem("stagebook.prefs", JSON.stringify(state.prefs)); } catch {} }

/* ---------- music theory ---------- */

  let res;
  try { res = await readOnSongBackup(file, await backupLibs()); }
  catch (e) { console.warn(e); toast("Couldn't open that file as an OnSong backup. In OnSong, make a fresh backup and try again."); return null; }

  const idMap = new Map();
  for (const o of res.songs) {
    const id = "os-" + safeId(o.osId); idMap.set(o.osId, id);
    const ex = state.songs.get(id);
    if (ex && !ex.deleted) {
      let changed = false;
      if (o.pdf && !(ex.pdf && ex.pdf.assetId) && !(await readLocalPdf(id))) {
        await putPdf(id, o.pdf);
        ex.pdf = Object.assign({}, ex.pdf, { name: (ex.pdf && ex.pdf.name) || o.pdfName || "song.pdf", size: o.pdf.size, local: true });

      if (fresh.length) { ex.stickies = (ex.stickies || []).concat(fresh); notes += fresh.length; changed = true; }
      if (changed) save("songs", ex); else skipped++;
      continue;
    }
    const s = newSong({ id, title: o.title || "Untitled song", artist: o.artist || "", key: o.key || "", capo: o.capo || 0, tempo: o.tempo || "", chart: o.chart || "", stickies: o.stickies || [] });
    notes += s.stickies.length;
    if (o.pdf) { s.pdf = { name: o.pdfName || "song.pdf", size: o.pdf.size, local: true }; await putPdf(id, o.pdf); s.view = s.chart.trim() ? "text" : "pdf"; }
    save("songs", s); added++; last = s;
  }
  for (const t of res.sets) {
    const id = "os-set-" + safeId(t.osId);
    if (state.sets.has(id) && !state.sets.get(id).deleted) continue;
    const items = t.songIds.map(x => idMap.get(x)).filter(Boolean).map(sid => ({ type: "song", id: sid }));
    if (!items.length) continue;
    save("sets", newSet({ id, name: t.name, group: "From OnSong", items })); sets++;
  }
  retryPdfUploads();
  toast(`From OnSong: ${added} song${added === 1 ? "" : "s"}, ${sets} set${sets === 1 ? "" : "s"}, ${notes} sticky note${notes === 1 ? "" : "s"}${repaired ? `, ${repaired} PDF${repaired === 1 ? "" : "s"} repaired` : ""}${skipped ? `. ${skipped} songs were already up to date` : ""}.${res.drawings ? ` ${res.drawings} pen drawings couldn't be brought over.` : ""}`);
  return { added: added + repaired, last };
}

function tbAdvance() {
  if (tb.move === "chord") { if (tb.sel.s < tb.labels.length - 1) tb.sel.s++; else { tb.sel.s = 0; tb.sel.c++; } }
  else tb.sel.c++;
  while (tb.sel.c < tb.cols.length && tb.cols[tb.sel.c].bar) tb.sel.c++;
  if (tb.sel.c >= tb.cols.length) tb.cols.push(...blankCols(8, tb.labels.length));
}
function onTabClick(e) {
  if (e.target.id === "tabsheet") return;
  const b = e.target.closest("[data-t]"); if (!b || !tb) return;
  const t = b.dataset.t, n = tb.labels.length, col = tb.cols[tb.sel.c];
  switch (t) {
    case "cell": tb.sel = { c: +b.dataset.c, s: +b.dataset.s }; tb.last = null; break;
    case "fret": {
      if (col.bar) break;
      const cur = col.cells[tb.sel.s] || "";
      col.cells[tb.sel.s] = /[hp\/\\br(]$/.test(cur) ? cur + b.dataset.v : b.dataset.v;
      tb.last = { c: tb.sel.c, s: tb.sel.s };
      tbAdvance(); break;
    }
    case "tech": {
      if (col.bar) break;
      const v = b.dataset.v;
      /* "5", then "h", then "7" should make one "5h7": a technique right after a fret goes back onto that fret's spot. */
      if (v !== "x" && v !== "(" && !(col.cells[tb.sel.s]) && tb.last) { tb.sel = { c: tb.last.c, s: tb.last.s }; }
      const cell = tb.cols[tb.sel.c], cur = cell.cells[tb.sel.s] || "";
      tb.last = null;
      if (v === "x" && !cur) { cell.cells[tb.sel.s] = "x"; tbAdvance(); break; }
      if (v === "(") { cell.cells[tb.sel.s] = "(" + cur; break; }
      cell.cells[tb.sel.s] = cur + v;
      break;
    }
    case "clear": if (col.bar) tb.cols.splice(tb.sel.c, 1); else col.cells[tb.sel.s] = ""; if (!tb.cols.length) tb.cols = blankCols(8, n); tb.sel.c = Math.min(tb.sel.c, tb.cols.length - 1); break;
    case "nav": tb.sel.c = clamp(tb.sel.c + +b.dataset.v, 0, tb.cols.length - 1); break;
    case "move": tb.move = tb.move === "chord" ? "beat" : "chord"; break;
    case "bar": tb.cols.splice(tb.sel.c + 1, 0, { bar: true, cells: Array(n).fill("") }); tb.sel.c += 2; if (tb.sel.c >= tb.cols.length) tb.cols.push(...blankCols(4, n)); break;
    case "space": tb.cols.splice(tb.sel.c, 0, ...blankCols(1, n)); break;
    case "delcol": tb.cols.splice(tb.sel.c, 1); if (!tb.cols.length) tb.cols = blankCols(8, n); tb.sel.c = Math.min(tb.sel.c, tb.cols.length - 1); break;
    case "more": tb.cols.push(...blankCols(8, n)); break;
    case "kind": {
      const before = tuningString(); setTuning(TUNINGS[b.dataset.v]); state.prefs.tabKind = b.dataset.v; savePrefs();
      if (before !== tuningString()) toast(b.dataset.v === "bass" ? "Switched to 4-string bass." : "Switched to 6-string guitar.");
      break;

    case "insert": insertTab(); return;

}
function insertTab() {
  const ta = $("#f-chart"); if (!ta || !tb) { closeTabBuilder(); return; }

  const text = formatTab(tb).join("\n");
  const val = ta.value;
  if (tb.block) {
    const lines = val.split("\n");
    lines.splice(tb.block.a, tb.block.b - tb.block.a + 1, ...text.split("\n"));

  } else {

    case "tab-cancel": $("#tabbar")?.remove(); break;
    case "markup": state.markup = !state.markup; if (sheet) state.markup ? sheet.showTray() : sheet.hideTray(); el.setAttribute("aria-pressed", String(state.markup)); break;
    case "add-to-set": {
      const s = state.songs.get(r.id);
      const items = liveSets().sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0)).slice(0, 15).map(t => ({ label: t.name || "Untitled set", run: () => { t.items = t.items.concat([{ type: "song", id: s.id }]); save("sets", t); toast(`Added to ${t.name || "set"}.`); } }));
      items.push({ label: "+ New set with this song", run: () => { const t = newSet({ name: "New set", items: [{ type: "song", id: s.id }] }); save("sets", t); go({ view: "set", id: t.id }); } });
      openMenu(el, items); break;
    }
    case "pdf-text": (async () => {
      const s = state.songs.get(r.id); const b = await getPdfBlob(s); if (!b) { toast("The PDF isn't available offline yet."); return; }
      try { const pdf = await openPdf(b); const { text, urls } = await pdfToText(pdf); const c = cleanPdfText(text, urls); const p = parseSongText(c.text, s.title);
        if (s.chart.trim()) s.chartBackup = s.chart;
        s.chart = p.chart; if (!s.tabUrl && c.tabUrl) s.tabUrl = c.tabUrl; if (!s.key && p.key) s.key = p.key; save("songs", s); render();
        toast("Chart text pulled from the PDF.", s.chartBackup ? { label: "Undo", run: () => { s.chart = s.chartBackup; save("songs", s); render(); } } : null);
      } catch (err) { toast("Couldn't read text from this PDF."); }
    })(); break;
    case "pdf-remove": { const s = state.songs.get(r.id); const old = s.pdf; s.pdf = null; s.view = "text"; save("songs", s); render(); toast("PDF removed.", { label: "Undo", run: () => { s.pdf = old; save("songs", s); render(); } }); break; }
    case "new-set": { const t = newSet({ group: state.setGroup }); save("sets", t); go({ view: "set", id: t.id }); setTimeout(() => $("#s-name")?.focus(), 50); break; }
    case "open-set": if (!e.target.closest('[data-act="perform"]')) go({ view: "set", id: el.dataset.id }); break;
    case "perform": e.stopPropagation(); go({ view: "perform", setId: el.dataset.id, idx: 0 }); break;
    case "set-open": { const t = state.sets.get(r.id); const idx = perfItems(t).indexOf(t.items[+el.dataset.i]); go({ view: "perform", setId: t.id, idx: Math.max(0, idx) }); break; }
    case "pick": { const t = state.sets.get(r.id); t.items = t.items.concat([{ type: "song", id: el.dataset.id }]); save("sets", t); const q = $("#pick-q").value; const y = $("#main").scrollTop; render(); $("#pick-q").value = q; renderPick(); $("#main").scrollTop = y; break; }
    case "add-break": { const t = state.sets.get(r.id); t.items = t.items.concat([{ type: "break", label: "Set break" }]); save("sets", t); const y = $("#main").scrollTop; render(); $("#main").scrollTop = y; break; }
    case "mv": { const t = state.sets.get(r.id); const i = +el.dataset.i, j = i + +el.dataset.d; const items = t.items.slice(); [items[i], items[j]] = [items[j], items[i]]; t.items = items; save("sets", t); const y = $("#main").scrollTop; render(); $("#main").scrollTop = y; break; }
    case "rm": { const t = state.sets.get(r.id); const before = t.items; t.items = t.items.filter((_, i) => i !== +el.dataset.i); save("sets", t); const y = $("#main").scrollTop; render(); $("#main").scrollTop = y; toast("Removed from set.", { label: "Undo", run: () => { t.items = before; save("sets", t); render(); } }); break; }
    case "delete-set": { const t = state.sets.get(r.id); t.deleted = true; t.deletedAt = Date.now(); save("sets", t); go({ view: "sets" }); toast(`Deleted “${t.name || "set"}”.`, { label: "Undo", run: () => { t.deleted = false; save("sets", t); go({ view: "set", id: t.id }); } }); break; }
    case "perf-exit": go({ view: "set", id: r.setId }); break;
    case "perf-go": perfGo(+el.dataset.d); break;
    case "perf-list": togglePerfList(el); break;
    case "perf-jump": { const i = +el.dataset.i; perfGo(i - (r.idx || 0)); break; }
    case "as-toggle": autoscroll.on ? stopAutoscroll() : startAutoscroll(); break;
    case "as-speed": if (song) { song.scrollSpeed = clamp((song.scrollSpeed ?? 3) + +el.dataset.d, 0, SPEEDS.length - 1); save("songs", song); const v = el.parentElement.querySelector(".val"); if (v) v.textContent = song.scrollSpeed + 1; } break;
    case "export": exportBackup(); break;
    case "awake": state.prefs.awake = !state.prefs.awake; savePrefs(); if (state.prefs.awake) keepAwake(); else stopAwake(); updateAwake(); toast(state.prefs.awake ? "The screen will stay on while Stagebook is open." : "The screen can sleep again."); break;
    case "remove-onsong":
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Tap again to remove the import"; setTimeout(() => { if (el.isConnected) render(); }, 5000); break; }
      removeOnSongImport(); break;
    case "restore": { const o = state[el.dataset.col].get(el.dataset.id); o.deleted = false; delete o.deletedAt; save(el.dataset.col, o); render(); toast(`Restored “${o.title || o.name}”.`); break; }
    case "purge": {
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Tap again to delete"; setTimeout(() => { if (el.isConnected) { el.dataset.confirm = ""; el.textContent = "Delete forever"; } }, 4000); break; }
      const col = el.dataset.col, o = state[col].get(el.dataset.id);
      const stub = { id: o.id, deleted: true, purged: true, deletedAt: o.deletedAt || Date.now(), title: "", name: "" };
      if (col === "songs") { IDB.del("blobs", "pdf:" + o.id); if (o.pdf && o.pdf.assetId && assetsApi) assetsApi.delete(o.pdf.assetId).catch(() => {}); const ink = state.ink.get(o.id); if (ink) save("ink", { id: o.id, text: [], pdf: [] }); }
      save(col, stub); render(); break;
    }
  }
});

/* ---------- start ---------- */
(async function start() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  for (const [k, v] of await IDB.entries("docs")) { const [col, id] = String(k).split("/"); if (state[col] instanceof Map && v) state[col].set(id, v); }
  for (const p of (await IDB.get("meta", "pending")) || []) state.pending.add(p);
  try { const r = JSON.parse(localStorage.getItem("stagebook.route") || "null"); if (r && ["songs", "sets", "backup", "song", "set"].includes(r.view)) state.route = r; } catch {}
  if ((state.route.view === "song" && !state.songs.get(state.route.id)) || (state.route.view === "set" && !state.sets.get(state.route.id))) state.route = { view: state.route.view === "set" ? "sets" : "songs" };
  render();
  initCloud();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && window.toast) toast("A new version of Stagebook is ready.", { label: "Reload", run: () => location.reload() });
  });
}
</script>
